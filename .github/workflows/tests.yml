name: Tests

on:
  push:
  pull_request:
  # Weekly, so a new Python release, or a change on GitHub's runners, that
  # breaks the script shows up even without a push. The tests talk to a fake
  # server, so a change in the Healthchecks or UptimeRobot API only shows up
  # in the live tests (tests/test_live.py), which need real accounts and are
  # skipped here. GitHub only runs this on the default branch, develop, from
  # its copy of this file, and pauses it after 60 days without repository
  # activity.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Every job can only read the repository, except coverage-badge, which
# writes the badges branch.
#
# Actions from anyone but GitHub are pinned to a commit, not a tag, since a
# tag can be moved to other code. The comment after each pin is its version,
# which Dependabot reads and updates along with the commit.
permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}${{ matrix.experimental && ' (pre-release, may fail)' || '' }}
    runs-on: ${{ matrix.os }}
    # The pre-release job may fail without failing the run.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.14"]
        # Windows decodes subprocess output differently and keeps its lock
        # files in its own temp folder, and macOS has its own file system
        # (APFS) and temp folder layout, so run the tests on both.
        include:
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
          # The next Python's pre-release, so a change in it that breaks the
          # script or the tests shows up before it's released. Once 3.15 is
          # out, make it the newest release above and move this to 3.16.
          - os: ubuntu-latest
            python-version: "3.15"
            experimental: true
    env:
      # Each job's own coverage data file, for the coverage job to combine.
      COVERAGE_FILE: .coverage.${{ matrix.os }}-${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          # Only matters for a version with no release yet, like 3.15 above.
          allow-prereleases: true
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Coverage is for information only: a lower number never fails the job.
      # The tests that run the script as a separate program measure it too
      # (tests/conftest.py), one data file per process, so combine comes first.
      - run: python -m coverage run -m pytest
      - run: python -m coverage combine
      - run: python -m coverage report
      # The pre-release is left out, so a run where it fails can't change the
      # total. The data file's name starts with a dot, which upload-artifact
      # skips unless told otherwise.
      - uses: actions/upload-artifact@v7
        if: ${{ !matrix.experimental }}
        with:
          name: coverage-data-${{ matrix.os }}-${{ matrix.python-version }}
          path: ${{ env.COVERAGE_FILE }}
          include-hidden-files: true
          retention-days: 1

  # Combines the coverage the tests measured on Linux (Python 3.10 and 3.14),
  # macOS and Windows, so code that only runs on one system or one Python
  # (the file permissions on Linux and macOS, say, or the tomli import on
  # 3.10) counts where it runs. Puts the report on the run's summary page,
  # and saves the total for the badge.
  coverage:
    name: Combine the coverage
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-*
          merge-multiple: true
      - run: python -m coverage combine
      - run: python -m coverage report
      - name: Add the coverage report to the run's summary page
        run: |
          echo "### Coverage of tronitor.py (tests on Linux, macOS and Windows)" \
            >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Save the coverage total for the badge
        run: python -m coverage report --format=total > coverage-total.txt
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-total
          path: coverage-total.txt
          retention-days: 1

  # Lint (ruff) and type checks (mypy), set up in pyproject.toml. mypy runs
  # twice: the script takes different paths on Linux and on Windows.
  # Then lints the workflows and the Markdown files.
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m mypy --platform linux
      - run: python -m mypy --platform win32
      # The workflows, including shellcheck on their scripts. Pinned, so a new
      # release with new checks can't suddenly fail the job, and to its digest,
      # since an image tag can be moved too. Dependabot doesn't update images
      # used this way, so update the tag and digest by hand.
      - name: Lint the workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
      # The README, the pages in docs/, the changelog and everything in
      # .github, with the settings in .markdownlint.json.
      - name: Lint the Markdown files
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"

  # Writes the coverage total to coverage-<branch>.json on the badges branch,
  # which the README's coverage badge reads through shields.io (master's; the
  # README doesn't show develop's, but it's kept up to date too). Only runs
  # for pushes to master and develop, once the coverage job has combined the
  # coverage of the tests.
  coverage-badge:
    name: Update the coverage badge
    needs: coverage
    if: github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'develop')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: coverage-total
      - name: Commit the badge to the badges branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          total=$(cat coverage-total.txt)
          if [ "$total" -ge 90 ]; then color=brightgreen
          elif [ "$total" -ge 75 ]; then color=yellowgreen
          elif [ "$total" -ge 60 ]; then color=yellow
          else color=red
          fi
          if git fetch --depth=1 origin badges; then
            git worktree add --detach "$RUNNER_TEMP/badges" FETCH_HEAD
          else
            git worktree add --orphan -b badges "$RUNNER_TEMP/badges"
          fi
          cd "$RUNNER_TEMP/badges"
          printf '{"schemaVersion": 1, "label": "coverage: %s", "message": "%s%%", "color": "%s"}\n' \
            "$BRANCH" "$total" "$color" > "coverage-$BRANCH.json"
          git add "coverage-$BRANCH.json"
          if git diff --cached --quiet; then
            echo "Coverage unchanged at $total%"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Coverage on $BRANCH: $total%"
          # A push to the other branch may have updated its badge in the meantime.
          git push origin HEAD:badges || {
            git pull -q --rebase origin badges && git push origin HEAD:badges
          }
