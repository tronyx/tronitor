# Settings for the checks run on every push.
# Only ruff, mypy and pytest read this file; it isn't needed to use the script.

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# pycodestyle's rules (E) on top of ruff's defaults. Its whitespace checks are
# still preview rules, so preview is on; ruff is pinned, so a change to them
# arrives in a reviewed update rather than unannounced.
preview = true
extend-select = ["E"]

[tool.mypy]
python_version = "3.10"
files = ["tronitor.py"]
# Strict: every function fully typed, and no value of unknown type passed off
# as a known one, so a loose type hint fails the check rather than slipping by.
strict = true
ignore_missing_imports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
